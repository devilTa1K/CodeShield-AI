services:
  - type: web
    name: codeshield-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: BHARATCODE_API_KEY
        sync: false          # set privately in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # your frontend URL, e.g. https://codeshield-ai.onrender.com
      - key: BHARATCODE_MODEL
        value: qwen-3.8-27b

  - type: web
    name: codeshield-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # your API URL, e.g. https://codeshield-ai-api.onrender.com
